<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Error - Motor SPARQL</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #fff3f3;
      color: #800000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 2rem;
      border: 1px solid #ffcaca;
      border-radius: 10px;
      background: white;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.1);
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .emoji {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }
    a {
      padding: 0.5rem 1rem;
      background-color: #800000;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }
    a:hover {
      background-color: #a00000;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">❌</div>
    <h1>Ocurrió un error</h1>
    <p>{{ mensaje }}</p>
    <a href="/">Volver al inicio</a>
  </div>
</body>
</html>
